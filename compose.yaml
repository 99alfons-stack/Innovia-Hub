services:
  postgres:
    image: postgres:17
    container_name: innoviahub-postgres
    environment:
      POSTGRES_DB: ${database}
      POSTGRES_USER: ${username}
      POSTGRES_PASSWORD: ${password}
    ports:
      - "5433:5432"
    volumes:
      - innoviahub_data:/var/lib/postgresql/data

volumes:
  innoviahub_data: